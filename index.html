<title data-page-node-id="35pECf3EVu25lTONp8JKD7" data-pnid-children="LsyLLYXLL8ChMkuGy701Jo">我的星星</title>
<style data-page-node-id="WjVbh0ne3QsBZjz2hhT2MY" data-pnid-children="d9xbkJLGYBO8UC2uLYLv2K">
/* ========== 全局与配色（高饱和明快，面向5岁孩子） ========== */
:root{
  --bg1:#8FD3FF; --bg2:#6FB9F5; --bg3:#9FF0D5;      /* 背景渐变：天空蓝→清爽薄荷绿（男生版配色） */
  --card:#ffffff; --ink:#1F3A56;                     /* 卡片白、文字深海军蓝 */
  --star:#FFB300; --green:#22C55E; --blue:#2E86F0;
  --pink:#F06292; --purple:#6C5CE7; --orange:#2E86F0; /* 强调色统一为亮蓝色（变量名保留 orange 便于追溯） */
  --shadow:0 6px 0 rgba(0,0,0,.08);
  --r:24px;                                          /* 大圆角 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}  /* 禁止下拉回弹 */
html{
  /* 状态栏/安全区露出时显示与页面一致的渐变色，避免全屏模式出现空白条 */
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-attachment:fixed;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-attachment:fixed;
  color:var(--ink);
  width:100%;margin:0;               /* iPad 优先：容器 100% 宽，不写死像素宽度 */
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));  /* 底部留出标签栏+小白条高度 */
  overflow-x:hidden;                  /* 禁止横向滚动 */
  touch-action:pan-y;                 /* 只允许纵向滑动，禁双指缩放手势 */
  -webkit-font-smoothing:antialiased;
}

/* ========== 顶部：我的星星（常驻总积分） ========== */
header{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.score-box{
  background:linear-gradient(135deg,#4DABF7,#1E7BE0);  /* 顶部星星卡：蓝色渐变 */
  border-radius:var(--r);box-shadow:var(--shadow);
  padding:14px 20px;display:flex;align-items:center;gap:14px;
  border:3px solid #fff;
}
.score-box .star-ico{font-size:clamp(40px,5vw,56px);line-height:1}
.score-num{font-size:clamp(44px,6vw,68px);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15);line-height:1;min-width:60px}
.score-label{font-size:clamp(15px,1.8vw,20px);font-weight:700;color:#fff;opacity:.95}
.parent-door{            /* 家长入口：小、不显眼，需长按3秒 */
  margin-left:auto;background:rgba(255,255,255,.6);border:none;border-radius:16px;
  min-width:48px;min-height:48px;font-size:22px;line-height:1;padding:10px;cursor:pointer;
}
.parent-door:active{background:rgba(255,255,255,.9)}

/* ========== 底部标签栏 ========== */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  width:100%;                          /* iPad 优先：100% 宽，不写死像素 */
  display:flex;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);
}
nav button{
  flex:1;max-width:420px;margin:0 auto; /* 按钮弹性拉伸，超宽屏时也不会无限变宽 */
  min-height:56px;border:none;border-radius:20px;
  font-size:clamp(17px,2vw,22px);font-weight:800;
  background:rgba(255,255,255,.75);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
}
nav button.on{background:#fff;color:var(--orange);border:3px solid var(--orange)}
nav .tab-ico{font-size:22px;display:block}

/* 横屏矮窗口：压缩头部与标签栏，保证打卡/兑换按钮仍在首屏可见 */
@media (orientation:landscape) and (max-height:560px){
  header{padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px}
  .score-box{padding:8px 16px}
  .score-box .star-ico{font-size:30px}
  .score-num{font-size:clamp(30px,5vh,40px)}
  .score-label{font-size:13px}
  main{padding:6px 16px}
  .page-title{margin:4px 2px 8px}
  nav{padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 6px)}
  nav button{min-height:48px}
  nav .tab-ico{font-size:18px}
}

/* ========== 卡片通用 ========== */
main{padding:10px 16px}
.page-title{font-size:clamp(20px,3vw,30px);font-weight:900;margin:6px 2px 12px}
/* 卡片网格自适应列数：手机 1 列 → iPad 竖屏 2 列 → iPad 横屏 3 列 */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:768px){ .grid{grid-template-columns:1fr 1fr} }
@media(min-width:768px) and (orientation:landscape){ .grid{grid-template-columns:1fr 1fr 1fr} }

.task-card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:18px 16px;display:flex;align-items:center;gap:14px;
  min-height:92px;position:relative;cursor:pointer;
  transition:transform .25s;
  perspective:600px;
}
.task-card:active{transform:scale(.97)}
.task-emoji{font-size:clamp(44px,5vw,60px);line-height:1;flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-name{font-size:clamp(19px,2.4vw,26px);font-weight:800;margin-bottom:4px}
.task-pts{font-size:clamp(15px,1.8vw,20px);font-weight:700;color:var(--star)}
.task-state{font-size:clamp(14px,1.6vw,18px);font-weight:800;color:#fff;border-radius:12px;padding:4px 10px;flex-shrink:0}
/* 翻转动画：打卡时卡片转一圈 */
.task-card.flipping{animation:flip .7s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(360deg)}}
/* 已完成态 */
.task-card.done{background:#E9FBF2;border:3px solid var(--green)}
.task-card.done .task-state{background:var(--green)}
/* 待家长确认态 */
.task-card.waiting{background:#FFF8E1;border:3px solid #FFC107}
.task-card.waiting .task-state{background:#FFC107}

/* 兑换卡片 */
.reward-card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border:3px solid #fff;
}
.reward-emoji{font-size:clamp(48px,5vw,64px);line-height:1}
.reward-name{font-size:clamp(18px,2.2vw,24px);font-weight:800;text-align:center}
.reward-cost{font-size:clamp(15px,1.8vw,20px);font-weight:800;color:var(--orange)}
.reward-btn{
  min-height:48px;min-width:80%;border:none;border-radius:16px;
  font-size:clamp(16px,1.8vw,20px);font-weight:900;color:#fff;background:var(--green);
  box-shadow:var(--shadow);cursor:pointer;padding:10px 16px;
}
.reward-btn.no{background:#D8D2C8;}        /* 星星不够：置灰（温和文案在按钮上） */
.reward-btn.zero{background:#D8D2C8;}      /* 库存为0：置灰 */

/* 我的兑换券 */
.voucher{
  background:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  border:3px dashed var(--purple);margin-bottom:10px;
}
.voucher .v-emoji{font-size:34px}
.v-name{font-weight:800;font-size:17px;flex:1}
.v-tag{font-size:13px;font-weight:900;color:#fff;border-radius:10px;padding:4px 10px}
.v-tag.pending{background:var(--orange)}
.v-tag.ok{background:var(--green)}

/* 粒子星星 */
.pop-star{
  position:fixed;z-index:99;font-size:26px;pointer-events:none;
  animation:starFly .9s ease-out forwards;
}
@keyframes starFly{
  0%{transform:translate(0,0) scale(.6);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}
}

/* ========== 弹窗 / 提示 ========== */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;  /* 必须高于家长面板(60)，编辑弹窗才能在家长端内直接显示 */
  display:none;align-items:center;justify-content:center;padding:20px;
}
.mask.show{display:flex}
.modal{
  background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:min(560px,92vw);

.modal h3{margin:0 0 14px;font-size:20px;text-align:center}
.modal .m-emoji{text-align:center;font-size:56px;margin-bottom:6px}

.m-btn{
  flex:1;min-height:52px;border:none;border-radius:16px;font-size:17px;font-weight:900;
  color:#fff;cursor:pointer;
}
.m-btn.ok{background:var(--green)} .m-btn.cancel{background:#C9C2B6} .m-btn.warn{background:var(--pink)}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.field input[type=text],.field input[type=number],.field input[type=password],.field select{
  width:100%;min-height:48px;border:2px solid #E8DFCE;border-radius:14px;font-size:17px;
  padding:8px 12px;font-family:inherit;background:#FFFDF7;color:var(--ink);

.field input:focus,.field select:focus{outline:none;border-color:var(--orange)}
.week-days{display:flex;gap:6px;flex-wrap:wrap}
.week-days label{
  min-width:44px;min-height:44px;border:2px solid #E8DFCE;border-radius:12px;

.week-days input{display:none}
.week-days input:checked+span{color:#fff}
.week-days label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.check-row{display:flex;align-items:center;gap:10px;min-height:48px}

/* 轻提示 */
.toast{
  position:fixed;top:18%;left:50%;transform:translateX(-50%) scale(.8);z-index:99;

}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

<script data-page-node-id="sGNz215M6T7QimkqJsSa64" data-pnid-children="spOedKQqEFbmLKI81RkvTi">
'use strict';
/* =====================================================================
 * 儿童打卡积分兑换系统（单文件离线版）
 * 数据全部保存在浏览器 localStorage，不会上传到任何服务器。
 * ===================================================================== */

const KEY = 'kidReward_v1';   // localStorage 存储键名

/* ---------- 数据结构与读写 ---------- */
function defaultData(){
  return {
    points: 0,                    // 当前总积分
    streak: {count:0, last:''},   // 连续打卡：天数 + 最后打卡日期
    earnedToday: {},              // 每日已获得积分记录 { '2026-11-22': 12 }，用于每日上限
    tasks: [                      // 打卡任务（内置示例，家长可改）
      {id:id(), name:'自己刷牙', emoji:'🦷', points:2, freq:{type:'daily'}, needConfirm:false, done:{}},
      {id:id(), name:'收拾玩具', emoji:'🧸', points:3, freq:{type:'daily'}, needConfirm:false, done:{}},
      {id:id(), name:'读一本绘本', emoji:'📚', points:3, freq:{type:'daily'}, needConfirm:true, done:{}},
    ],
    rewards: [                    // 兑换奖励（stock 为 null 表示不限量）
      {id:id(), name:'看一集动画片', emoji:'📺', cost:10, stock:null},
      {id:id(), name:'去公园玩', emoji:'🛝', cost:50, stock:null},
      {id:id(), name:'新玩具', emoji:'🎁', cost:200, stock:1},
    ],
    vouchers: [],                 // 兑换券 {id, name, emoji, cost, ts, status:'pending'|'ok'}
    log: [],                      // 积分流水 {ts, delta, reason}
    pending: [],                  // 待家长确认的打卡 {taskId, date, points}
    settings: {dailyCap:30, password:''}  // 每日积分上限；密码为空=长按直接进入
  };
}
function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.warn('读取存档失败', e); }
  return defaultData();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast('保存失败，请检查浏览器存储权限'); } }
let D = load();

/* ---------- 日期工具（孩子端不显示日期，仅内部计算用） ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); } // 0=周日

/* ---------- 音效：WebAudio 合成，无需外部音频文件 ---------- */
let audioCtx = null;
function beep(freq, start, dur, type){
  const c = audioCtx;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, c.currentTime+start);
  g.gain.exponentialRampToValueAtTime(0.25, c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.05);
}
function playSound(kind){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(kind==='checkin'){                    // 打卡：上行三连音（欢快）
      beep(523,0,.12); beep(659,.1,.12); beep(784,.2,.2);
    }else if(kind==='bonus'){                // 连击奖励：小旋律
      beep(659,0,.1); beep(784,.09,.1); beep(988,.18,.1); beep(1175,.27,.25);
    }else if(kind==='coin'){                 // 兑换成功
      beep(880,0,.1); beep(880,.12,.1); beep(1318,.24,.3);
    }else if(kind==='tap'){ beep(660,0,.08); }
  }catch(e){/* 音频不可用时静默 */}
}

/* ---------- 星星粒子动画 ---------- */
function burstStars(x, y){
  const emojis = ['⭐','✨','🌟','💫'];
  for(let i=0;i<14;i++){
    const s = document.createElement('span');
    s.className = 'pop-star';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const ang = Math.random()*Math.PI*2, dist = 60+Math.random()*90;
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', (Math.sin(ang)*dist-60)+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

/* ---------- 轻提示（鼓励式文案） ---------- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- 总积分数字滚动动画 ---------- */
let shownScore = D.points;   // 记录当前显示值，实现从旧值滚到新值
function rollScore(){
  const el=document.getElementById('scoreNum');
  const from=shownScore, to=D.points;
  if(from===to){ el.textContent=to; return; }
  const dur=600, start=performance.now();
  function step(now){
    const p=Math.min(1,(now-start)/dur);
    const v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));  // 缓出曲线
    el.textContent=v;
    if(p<1) requestAnimationFrame(step); else shownScore=to;
  }
  requestAnimationFrame(step);
}

/* =====================================================================
 * 孩子端：任务
 * ===================================================================== */
// 计算某个任务在今天是否需要做
function isTaskForToday(task){
  const t = todayStr();
  if(task.freq.type==='daily') return true;
  if(task.freq.type==='weekly') return (task.freq.days||[]).includes(weekdayOf(t));
  if(task.freq.type==='once') return !(task.done && Object.keys(task.done).length); // 一次性：做过就不再显示
  return false;
}
// 今天「应做未做」的任务列表
function todayTasks(){
  return D.tasks.filter(isTaskForToday);
}
// 鼓励语随机池（全正面）
const CHEERS = ['太棒啦！','你真厉害！','哇，好棒呀！','继续保持哦！','超级无敌棒！','好厉害的小星星！'];

/* 孩子点击打卡（核心逻辑） */
function checkin(taskId, ev){
  const task = D.tasks.find(t=>t.id===taskId);
  if(!task) return;
  const t = todayStr();
  if(task.done && task.done[t]) return;              // 同一任务每天只能打卡一次

  // 1) 卡片翻转动画 + 星星粒子 + 音效（先给即时反馈）
  const card = ev.currentTarget;
  card.classList.add('flipping');
  playSound('checkin');
  burstStars(ev.clientX||window.innerWidth/2, ev.clientY||200);

  // 2) 计算连击：昨天有打卡→+1；断了→从1重新开始；今天已计过→不变
  let bonus = 0;
  if(D.streak.last !== t){
    D.streak.count = (D.streak.last === yesterdayStr()) ? D.streak.count+1 : 1;
    D.streak.last = t;
    if(D.streak.count % 5 === 0) bonus = 5;          // 每连续满5天额外+5
  }

  // 3) 每日上限：超过上限的部分不再加（打卡仍算完成，不让孩子失望）
  const cap = D.settings.dailyCap;
  const earned = D.earnedToday[t] || 0;
  const remain = Math.max(0, cap - earned);
  const given = Math.min(task.points, remain);
  D.earnedToday[t] = earned + given;
  D.points += given + bonus;                          // 连击奖励不受上限影响（家长可自行调整此规则）
  D.log.push({ts:Date.now(), delta:given+bonus, reason:'打卡「'+task.name+'」'+(bonus? '（连击'+D.streak.count+'天奖励+5）':'')});

  // 4) 标记完成 / 待确认
  if(!task.done) task.done = {};
  task.done[t] = true;
  if(task.needConfirm){
    D.pending.push({taskId:task.id, date:t, points:given+bonus});   // 进家长审批队列
  }

  save(); rollScore();
  setTimeout(()=>{
    renderKid();
    toast(bonus>0 ? '连击 '+D.streak.count+' 天！额外 +5 颗星星！🎉' : CHEERS[Math.floor(Math.random()*CHEERS.length)]);
    if(bonus>0) playSound('bonus');
  }, 650);
}

/* 渲染孩子端任务列表 */
function renderKidTasks(){
  const box = document.getElementById('taskList');
  const list = todayTasks();
  const t = todayStr();
  if(!list.length){
    box.innerHTML = '<div class="empty-tip" style="grid-column:1/-1">今天没有任务，尽情玩吧！🎈</div>';
    return;
  }
  box.innerHTML = list.map(task=>{

    const isWait = D.pending.some(p=>p.taskId===task.id && p.date===t);
    let state = '';
    if(isWait) state = '<span class="task-state" style="background:#FFC107">等爸爸妈妈看看 ⏳</span>';
    else if(isDone) state = '<span class="task-state">太棒啦 ✓</span>';
    else state = '<span class="task-state" style="background:var(--blue)">还没做</span>';
    const cls = isWait?'waiting':(isDone?'done':'');
    return `<div class="task-card ${cls}" ${(!isDone&&!isWait)?`onclick="checkin('${task.id}',event)"`:''}>
      <div class="task-emoji">${task.emoji}</div>
      <div class="task-info">
        <div class="task-name">${task.name}</div>
        <div class="task-pts">⭐ +${task.points}</div>
      </div>
      ${state}
    </div>`;
  }).join('');
}

function askRedeem(rid){
  const r = D.rewards.find(x=>x.id===rid);
  if(!r) return;
  playSound('tap');
  showModal(`
    <div class="m-emoji">${r.emoji}</div>
    <h3>用 ${r.cost} 颗星星<br>换「${r.name}」吗？</h3>
    <div class="m-btn-row">
      <button class="m-btn cancel" onclick="hideModal()">再想想</button>
      <button class="m-btn ok" onclick="doRedeem('${r.id}')">确定换！</button>
    </div>`);
}
function doRedeem(rid){
  const r = D.rewards.find(x=>x.id===rid);
  hideModal();
  if(!r) return;
  if(r.stock!==null && r.stock<=0){ toast('已经被换完啦'); renderKid(); return; }
  if(D.points < r.cost){ toast('还差 '+(r.cost-D.points)+' 颗星星，继续加油！'); renderKid(); return; }
  D.points -= r.cost;
  if(r.stock!==null) r.stock--;
  D.vouchers.push({id:id(), rewardId:r.id, name:r.name, emoji:r.emoji, img:r.img||null, cost:r.cost, ts:Date.now(), status:'pending'});
  D.log.push({ts:Date.now(), delta:-r.cost, reason:'兑换「'+r.name+'」'});
  save(); rollScore(); renderKid();
  playSound('coin'); burstStars(window.innerWidth/2, 300);
  toast('换好啦！去找爸爸妈妈兑现吧 🎉');
}

/* ---------- 奖励自定义图片：选择 → 压缩 → 预览 ----------
 * 用 canvas 等比压缩到最长边 400px、JPEG 80% 质量，
 * 避免原图太大撑爆 localStorage（约 5MB 上限）。 */
function resizeImg(file, max, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>max || h>max){ const k = max/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c = document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function previewRewardImg(ev){
  const file = ev.target.files[0];
  if(!file) return;
  resizeImg(file, 400, dataUrl=>{
    window._rewardImg = dataUrl;
    const box = document.getElementById('rImgPreview');
    if(box) box.innerHTML = `<img src="${dataUrl}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:12px">
      <button type="button" class="p-btn red" onclick="clearRewardImg()" style="margin-left:8px">移除图片</button>`;
  });
}
function clearRewardImg(){
  window._rewardImg = null;
  document.getElementById('rImgPreview').innerHTML = '';
  document.getElementById('rImg').value = '';
}

/* ---------- 手动加减分（留痕） ---------- */
function renderPAdjust(){
  const recent = D.log.slice(-8).reverse().map(l=>`
    <div class="log-row"><span>${new Date(l.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} ${l.reason}</span>
    <span class="log-delta ${l.delta>=0?'plus':'minus'}">${l.delta>=0?'+':''}${l.delta}</span></div>`).join('');
  return `
    <div class="p-card">
      <div class="field"><label>加分 / 减分</label>
        <select id="adjType"><option value="1">➕ 加分</option><option value="-1">➖ 减分</option></select>
      </div>
      <div class="field"><label>分数</label><input type="number" id="adjPts" min="1" value="3"></div>
      <div class="field"><label>原因（会记录下来）</label><input type="text" id="adjReason" placeholder="如：主动收拾玩具"></div>
      <button class="add-btn" style="background:var(--green)" onclick="doAdjust()">确定</button>
    </div>
    <div class="p-card"><div class="p-sub" style="margin-bottom:6px">最近流水</div>${recent||'<div class="empty-tip">暂无记录</div>'}</div>`;
}
function doAdjust(){
  const sign = parseInt(document.getElementById('adjType').value);
  const pts = Math.abs(parseInt(document.getElementById('adjPts').value)||0);
  const reason = document.getElementById('adjReason').value.trim() || (sign>0?'家长加分':'家长减分');
  if(!pts){ toast('请填写分数'); return; }
  const delta = sign*pts;
  D.points = Math.max(0, D.points + delta);           // 总分不为负
  D.log.push({ts:Date.now(), delta, reason});
  save(); rollScore(); switchPTab('adjust'); toast('已'+(delta>0?'加':'减')+' '+pts+' 分');
}

    </div>`).join('') : '<div class="empty-tip">没有待兑现的兑换券</div>';

  return `
    <div class="p-card"><div class="p-name" style="margin-bottom:6px">⏳ 待确认的打卡（${pend.length}）</div>${pendHtml}</div>
    <div class="p-card"><div class="p-name" style="margin-bottom:6px">🎫 待兑现的兑换券（${pv.length}）</div>${pvHtml}</div>`;
}
// 确认打卡：积分已在打卡时给出，这里只是移出队列
function okConfirm(taskId, date){
  D.pending = D.pending.filter(p=>!(p.taskId===taskId && p.date===date));
  save(); switchPTab('approve'); toast('已确认 ✓');
}
// 退回打卡：扣除积分、取消完成状态、不破坏连击规则之外的数据
function noConfirm(taskId, date){
  const p = D.pending.find(x=>x.taskId===taskId && x.date===date);
  if(!p) return;
  D.points = Math.max(0, D.points - p.points);
  const earned = D.earnedToday[date]||0;
  D.earnedToday[date] = Math.max(0, earned - p.points);
  D.log.push({ts:Date.now(), delta:-p.points, reason:'打卡退回'});
  const t = D.tasks.find(x=>x.id===taskId);
  if(t && t.done) delete t.done[date];
  D.pending = D.pending.filter(x=>x!==p);
  save(); switchPTab('approve'); toast('已退回并扣回积分');
}
function okVoucher(vid){
  const v = D.vouchers.find(x=>x.id===vid);
  if(v) v.status='ok';
  save(); switchPTab('approve'); toast('已兑现 🎉');
}

/* ---------- 记录与统计 ---------- */
// 计算某天「计划任务数」与「实际完成数」，用于打卡率
function dayStat(dateStr){
  const dow = weekdayOf(dateStr);
  let plan = 0, done = 0;
  D.tasks.forEach(t=>{
    let scheduled = false;
    if(t.freq.type==='daily') scheduled = true;
    else if(t.freq.type==='weekly') scheduled = (t.freq.days||[]).includes(dow);
    else if(t.freq.type==='once'){
      const doneDates = Object.keys(t.done||{}).sort();
      scheduled = !(doneDates.length && doneDates[0] <= dateStr); // 一次性任务在该日期前已做过则不算
    }
    if(scheduled){ plan++; if(t.done && t.done[dateStr]) done++; }
  });
  return {plan, done};
}
// 本周/本月日期范围（周一为一周起点）
function weekRange(){
  const now = new Date(); const dow = (now.getDay()+6)%7;   // 周一=0
  const list = [];
  for(let i=dow;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); list.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  return list;
}
function monthRange(){
  const now = new Date(); const list=[];
  for(let i=1;i<=now.getDate();i++){ const d=new Date(now.getFullYear(),now.getMonth(),i); list.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  return list;
}
function rangeStat(dates){
  let plan=0, done=0;
  dates.forEach(d=>{ const s=dayStat(d); plan+=s.plan; done+=s.done; });
  return {plan, done, rate: plan? Math.round(done/plan*100):0};
}
function renderPRecord(){
  const wk = rangeStat(weekRange());
  const mo = rangeStat(monthRange());
  const logRows = D.log.slice(-30).reverse().map(l=>`
    <div class="log-row"><span>${new Date(l.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} ${l.reason}</span>
    <span class="log-delta ${l.delta>=0?'plus':'minus'}">${l.delta>=0?'+':''}${l.delta}</span></div>`).join('');
  const vRows = D.vouchers.slice().reverse().map(v=>`
    <div class="p-row">
      <div style="font-size:26px">${v.emoji}</div>
      <div class="grow"><div class="p-name">${v.name}</div>
      <div class="p-sub">-${v.cost}分 · ${new Date(v.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
      <span class="v-tag ${v.status==='ok'?'ok':'pending'}">${v.status==='ok'?'已兑现':'待兑现'}</span>
    </div>`).join('');
  return `
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${wk.rate}%</div><div class="stat-lbl">本周打卡率 ${wk.done}/${wk.plan}</div></div>
      <div class="stat-box"><div class="stat-num">${mo.rate}%</div><div class="stat-lbl">本月打卡率 ${mo.done}/${mo.plan}</div></div>
      <div class="stat-box"><div class="stat-num">${D.points}</div><div class="stat-lbl">当前总积分</div></div>
      <div class="stat-box"><div class="stat-num">🔥 ${D.streak.count}</div><div class="stat-lbl">当前连续天数</div></div>
    </div>
    <div class="p-card"><div class="p-name" style="margin-bottom:8px">🎫 兑换记录</div>${vRows||'<div class="empty-tip">暂无兑换</div>'}</div>
    <div class="p-card"><div class="p-name" style="margin-bottom:8px">📒 积分流水（最近30条）</div>${logRows||'<div class="empty-tip">暂无流水</div>'}</div>`;
}

/* ---------- 设置：每日上限 / 密码 / 备份 / 重置 ---------- */
function renderPSetting(){
  return `
    <div class="p-card">
      <div class="field"><label>每日积分上限（达到后当天打卡不再加分，防止刷分）</label>
        <input type="number" id="capInput" min="1" value="${D.settings.dailyCap}"></div>
      <button class="add-btn" style="background:var(--blue)" onclick="saveCap()">保存上限</button>
      <div class="field"><label>家长密码（留空 = 长按3秒直接进入）</label>
        <input type="text" id="pwSet" value="${D.settings.password}" placeholder="如：1234"></div>
      <button class="add-btn" style="background:var(--blue)" onclick="savePw()">保存密码</button>
    </div>
    <div class="p-card">
      <div class="p-name" style="margin-bottom:6px">💾 备份与恢复</div>
      <div class="hint" style="margin-bottom:10px">⚠️ 数据只存在这台设备的浏览器里。清除浏览器缓存会清空数据，请定期导出备份！</div>
      <button class="add-btn" style="background:var(--green)" onclick="exportData()">导出备份（JSON 文件）</button>
      <button class="add-btn" style="background:var(--purple)" onclick="document.getElementById('importFile').click()">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
    <div class="p-card">
      <div class="p-name" style="margin-bottom:6px">🔄 重置</div>
      <button class="add-btn" style="background:var(--pink)" onclick="resetData()">清空全部数据（重新开始）</button>
    </div>
    <div class="p-card"><div class="hint">小贴士：用平板/手机的浏览器「添加到主屏幕」，即可全屏像 App 一样使用。</div></div>`;
}
function saveCap(){
  const v = Math.max(1, parseInt(document.getElementById('capInput').value)||30);
  D.settings.dailyCap = v; save(); toast('每日上限已设为 '+v);
}
function savePw(){
  D.settings.password = document.getElementById('pwSet').value.trim();
  save(); toast(D.settings.password?'密码已设置':'密码已清空');
}
/* 导出：把全部数据下载为 JSON 文件 */
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kid-reward-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出，请保存好文件 📁');
  }catch(e){ toast('导出失败：'+e.message); }
}
/* 导入：覆盖当前全部数据 */
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || typeof obj.points!=='number' || !Array.isArray(obj.tasks)) throw new Error('文件格式不对');
      confirmModal('导入会覆盖当前全部数据，确定吗？','导入',()=>{
        D = obj; save(); shownScore = D.points;
        closeParent(); renderKid(); toast('导入成功 ✓');
      }, true);
    }catch(e){ toast('导入失败：'+e.message); }
  };
  reader.readAsText(file);
  ev.target.value='';   // 允许重复选择同一文件
}
function resetData(){
  confirmModal('确定清空全部数据吗？此操作无法撤销！','清空',()=>{
    confirmModal('再确认一次：真的要清空吗？建议先导出备份。','确认清空',()=>{
      D = defaultData(); save(); shownScore = 0;
      closeParent(); renderKid(); toast('已重新开始 🌱');
    }, true);
  }, true);
}

/* =====================================================================
 * 启动
 * ===================================================================== */
renderKid();
// 禁止 iOS 双指捏合缩放页面（保持 App 手感）
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
// 断网/离线提示：本页面本身离线可用，无需联网
window.addEventListener('offline', ()=>toast('当前离线，放心使用，数据都存在本机 💾'));
</script>
