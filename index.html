<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>星星打卡</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    body{background:#e6f2ff;background-image:url('bg.png');background-size:cover;background-position:center;min-height:100vh}
    .container{display:flex;min-height:100vh}
    .sidebar{width:180px;background:rgba(255,255,255,0.75);padding:20px;display:flex;flex-direction:column;gap:16px}
    .user-card{background:#3498ff;border-radius:16px;padding:16px;color:white;text-align:center}
    .star-big{font-size:42px}
    .menu-item{padding:12px;border-radius:12px;background:rgba(255,255,255,0.6);cursor:pointer}
    .menu-item.active{background:#3498ff;color:white}
    .main{flex:1;padding:24px;overflow:auto}
    .progress-bar-wrap{background:#fff;border-radius:14px;padding:14px;margin-bottom:20px}
    .progress-top{display:flex;justify-content:space-between;margin-bottom:8px}
    .progress-bg{width:100%;height:14px;background:#e4e4e4;border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:#42c970}
    .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .task-card{background:rgba(255,255,255,0.75);border-radius:16px;padding:18px;position:relative;cursor:pointer}
    .task-done-mark{position:absolute;top:10px;left:10px;width:24px;height:24px;background:#42c970;border-radius:50%;color:white;display:grid;place-items:center;font-weight:bold}
    .task-star-tag{position:absolute;top:10px;right:10px;background:#ffb32c;color:white;padding:3px 8px;border-radius:999px;font-size:14px}
    .task-icon{font-size:40px;margin:8px 0}
    @media(max-width:768px){
      .container{flex-direction:column}
      .sidebar{width:100%;flex-direction:row;overflow-x:auto}
    }
  </style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div class="user-card">
      <div class="star-big">⭐</div>
      <div>Lv.<span id="level">1</span> · 再得<span id="nextNeed">9</span>⭐升级</div>
      <div style="font-size:28px;margin-top:8px"><span id="totalStar">0</span> 颗星星</div>
    </div>
    <div class="menu-item active" data-page="today">今日打卡</div>
    <div class="menu-item" data-page="shop">星星商城</div>
    <div class="menu-item" data-page="setting">家长设置</div>
  </div>
  <div class="main">
    <div class="progress-bar-wrap">
      <div class="progress-top">
        <span>今日进度 <span id="doneCount">0</span>/<span id="allCount">0</span></span>
        <span id="percent">0%</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="progressBar" style="width:0%"></div>
      </div>
    </div>
    <div><h3>今天要做的事 点一下卡片就能打卡哦!</h3></div>
    <div class="task-grid" id="taskList"></div>
  </div>
</div>
